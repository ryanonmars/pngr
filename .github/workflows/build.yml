name: Build and test platforms

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version embedded in the application and packages
        required: false
        default: '0.7.3'
        type: string
      package:
        description: Build release packages (version-tag release workflow only)
        required: false
        default: false
        type: boolean

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime: osx-arm64
          - runner: macos-15-intel
            runtime: osx-x64
          - runner: windows-2022
            runtime: win-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/nuget
          key: nuget-${{ runner.os }}-${{ runner.arch }}-dotnet10-${{ inputs.package && 'release' || 'ci' }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/NuGet.Config', '**/nuget.config', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-dotnet10-
      - name: Restore
        run: dotnet restore TraceScope.slnx
      - name: Build
        run: dotnet build TraceScope.slnx -c Release --no-restore
      - name: Test
        run: dotnet test TraceScope.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Test packaging verification
        run: python -m unittest discover -s tests/packaging -v
      - name: Package macOS
        if: inputs.package && runner.os == 'macOS'
        shell: bash
        env:
          PNGR_VERSION: ${{ inputs.version }}
          PNGR_RUNTIME: ${{ matrix.runtime }}
        run: scripts/package.sh "$PNGR_RUNTIME" "$PNGR_VERSION"
      - name: Package Windows
        if: inputs.package && runner.os == 'Windows'
        shell: pwsh
        env:
          PNGR_VERSION: ${{ inputs.version }}
        run: ./scripts/package.ps1 -Version $env:PNGR_VERSION
      - name: Verify distribution
        if: inputs.package
        shell: bash
        env:
          PNGR_VERSION: ${{ inputs.version }}
          PNGR_RUNTIME: ${{ matrix.runtime }}
        run: python scripts/verify-package.py "artifacts/pngr-$PNGR_RUNTIME.zip" "$PNGR_RUNTIME" "$PNGR_VERSION"
      - name: Prepare Windows wizard compiler
        if: inputs.package && runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $compilerDir 'makensis.exe'))) {
            choco install nsis --version=3.12.0 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          $compilerDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Package Windows installer and update feed
        if: inputs.package && runner.os == 'Windows'
        shell: pwsh
        env:
          PNGR_VERSION: ${{ inputs.version }}
        run: python scripts/package-windows-installer.py $env:PNGR_VERSION
      - name: Upload Windows installer assets
        if: inputs.package && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-win-x64
          path: artifacts/installers/win-x64/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Verify Windows installation and v0.7.1 update compatibility
        if: inputs.package && runner.os == 'Windows'
        shell: pwsh
        env:
          PNGR_VERSION: ${{ inputs.version }}
        run: |
          $package = Get-ChildItem artifacts/installers/win-x64/*-full.nupkg | Select-Object -First 1
          python scripts/windows/verify-install-update.py artifacts/installers/win-x64/Pngr-Setup.exe $package.FullName $env:PNGR_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer/update verification failed' }
      - name: Upload Windows installation verification
        if: always() && inputs.package && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installation-verification
          path: artifacts/screenshots/windows-installation/*
          if-no-files-found: warn
          retention-days: 7
      - name: Upload package
        if: inputs.package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pngr-${{ matrix.runtime }}
          path: artifacts/pngr-${{ matrix.runtime }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.runtime }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 7

  universal:
    name: Universal macOS installer
    if: inputs.package
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/nuget
          key: nuget-${{ runner.os }}-${{ runner.arch }}-dotnet10-universal-${{ hashFiles('**/*.csproj', '**/*.props', '**/NuGet.Config', '**/nuget.config', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-dotnet10-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pngr-osx-*
          merge-multiple: true
          path: artifacts
      - name: Cache DMG layout dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/pip
          key: pip-dmg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/macos/dmg-requirements.txt') }}
      - name: Assemble universal application, DMG and update feed
        shell: bash
        env:
          PNGR_VERSION: ${{ inputs.version }}
          PNGR_UNIVERSAL_USE_ARCHIVES: '1'
        run: scripts/package-universal.sh "$PNGR_VERSION"
      - name: Upload universal installer assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-osx-universal
          path: artifacts/installers/osx-universal/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  validate-installers:
    name: Validate public installer assets
    if: inputs.package
    needs: [build, universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts/release-assets
      - name: Verify feeds and generate checksums
        env:
          PNGR_VERSION: ${{ inputs.version }}
        run: python scripts/release-assets.py artifacts/release-assets "$PNGR_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-release-assets
          path: artifacts/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
