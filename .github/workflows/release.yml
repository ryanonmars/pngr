name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check release eligibility
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Skip an already published tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PNGR_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import json, os, urllib.error, urllib.parse, urllib.request
          tag = urllib.parse.quote(os.environ['PNGR_TAG'], safe='')
          url = f"https://api.github.com/repos/{os.environ['GH_REPO']}/releases/tags/{tag}"
          request = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  json.load(response)
              publish = 'false'
              print('Release already exists; skipping builds and publication.')
          except urllib.error.HTTPError as error:
              error.close()
              if error.code != 404:
                  raise
              publish = 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={publish}\n')
  platforms:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
      package: true
  publish:
    if: github.event_name == 'push'
    needs: platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-release-assets
          path: release-assets
      - name: Publish verified version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PNGR_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test -f release-assets/Pngr-macos-universal.dmg
          test -f release-assets/Pngr-Setup.exe
          test -f release-assets/SHA256SUMS
          (cd release-assets && sha256sum --check SHA256SUMS)
          test "$PNGR_TAG" != v0.7.0 # Existing release is immutable.
          if gh release view "$PNGR_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its assets." >&2
            exit 1
          fi
          version=${PNGR_TAG#v}
          if [[ "$version" == *-* ]]; then prerelease=--prerelease; else prerelease=; fi
          gh release create "$PNGR_TAG" release-assets/* \
            --verify-tag --title "Pngr $version" --generate-notes $prerelease
