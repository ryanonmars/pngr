name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Build-only validation version (does not create a release)
        required: true
        default: 'v0.7.0'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platforms:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  publish:
    if: github.event_name == 'push'
    needs: platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pngr-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PNGR_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test -f release-assets/pngr-osx-arm64.zip
          test -f release-assets/pngr-osx-x64.zip
          test -f release-assets/pngr-win-x64.zip
          version=${PNGR_TAG#v}
          if [[ "$version" == *-* ]]; then prerelease=--prerelease; else prerelease=; fi
          gh release create "$PNGR_TAG" release-assets/pngr-*.zip \
            --verify-tag --title "pngr $version" --generate-notes $prerelease
