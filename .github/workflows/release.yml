name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Build-only validation version (does not create a release)
        required: true
        default: 'v0.7.2'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platforms:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  publish:
    if: github.event_name == 'push'
    needs: platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-release-assets
          path: release-assets
      - name: Publish verified version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PNGR_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test -f release-assets/Pngr-macos-universal.dmg
          test -f release-assets/Pngr-Setup.exe
          test -f release-assets/SHA256SUMS
          (cd release-assets && sha256sum --check SHA256SUMS)
          test "$PNGR_TAG" != v0.7.0 # Existing release is immutable.
          if gh release view "$PNGR_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its assets." >&2
            exit 1
          fi
          version=${PNGR_TAG#v}
          if [[ "$version" == *-* ]]; then prerelease=--prerelease; else prerelease=; fi
          gh release create "$PNGR_TAG" release-assets/* \
            --verify-tag --title "Pngr $version" --generate-notes $prerelease
